name: Android ROM Builder

on:
  workflow_dispatch:
    inputs:
      rom_name:
        description: 'ROM Name (e.g. RisingOS, AfterlifeOS)'
        required: true
        default: 'DerpfestOS'
      manifest_url:
        description: 'Manifest Git URL'
        required: true
        default: 'https://github.com/VoltageOS/manifest.git'
      manifest_branch:
        description: 'Manifest Branch (e.g. fourteen)'
        required: true
        default: '13'
      device_codename:
        description: 'Device Codename (e.g. violet, sweet, RMX3031)'
        required: true
        default: 'Blossom'
      device_name:
        description: 'Device Name (e.g. Redmi Note 7 Pro, Realme X7 Max)'
        required: true
        default: 'Blossom'
      lunch_combo:
        description: 'Lunch Combo (e.g. lunch lineage_violet-userdebug)'
        required: false
        default: ''
      device_tree:
        description: 'Device Tree Git URL'
        required: true
        default: 'https://github.com/Jayedkhan800/android_device_xiaomi_blossom.git -b lineage-20'
      vendor_tree:
        description: 'Vendor Tree Git URL'
        required: true
        default: 'https://github.com/TelegramAt25/proprietary_vendor_xiaomi_blossom.git -b lineage-20'
      kernel_tree:
        description: 'Kernel Tree Git URL'
        required: true
        default: 'https://github.com/TelegramAt25/device_xiaomi_blossom-kernel.git -b lineage-20'
      hardware_tree:
        description: 'Kernel Tree Git URL'
        required: true
        default: 'https://github.com/LineageOS/android_hardware_mediatek.git -b lineage-20'
      sepolicy_tree:
        description: 'Kernel Tree Git URL'
        required: true
        default: 'https://github.com/LineageOS/android_device_mediatek_sepolicy_vndr.git -b lineage-20'
      telegram_group_id:
        description: 'Telegram Group Chat ID (negative, e.g. -1001234567890). Leave empty to use the TG_CHAT_ID secret.'
        required: false
        default: ''
jobs:
  build:
    name: Android ROM Builder
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y openjdk-11-jdk bc bison build-essential curl flex git gnupg gperf \
        libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush repo rsync \
        schedtool squashfs-tools xsltproc zip unzip zlib1g-dev ccache

    - name: Setup Git & Repo
      run: |
        git config --global user.name "${{ secrets.GIT_USERNAME }}"
        git config --global user.email "${{ secrets.GIT_EMAIL }}"
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod +x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Setup Telegram Group
      run: |
        CHAT_ID="${TG_CHAT_ID:-}"
        if [ -n "${{ github.event.inputs.telegram_group_id }}" ]; then
          CHAT_ID="${{ github.event.inputs.telegram_group_id }}"
        fi
        echo "TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }}" >> "$GITHUB_ENV"
        echo "TG_CHAT_ID=${CHAT_ID}" >> "$GITHUB_ENV"
        echo "Telegram configured for group chat."

    - name: Notify Telegram - Build Started
      run: |
        START_TIME=$(date +%s)
        echo "START_TIME=$START_TIME" >> $GITHUB_ENV
        source .github/scripts/telegram.sh
        tg_send_md "🚀 *Starting Build: ${{ github.event.inputs.rom_name }}*\n━━━━━━━━━━━━━━━━━━━━\n\
          📱 *Device:* \`${{ github.event.inputs.device_codename }}\` ( ${{ github.event.inputs.device_name }} )\n\
          🔧 *Status:* Compilation started via GitHub Actions..."

    - name: Initialize Repo & Sync
      run: |
        source .github/scripts/telegram.sh
        mkdir rom && cd rom
        repo init -u ${{ github.event.inputs.manifest_url }} -b ${{ github.event.inputs.manifest_branch }} --depth=1
        tg_send_md "🔄 *Repo Sync Started* for \`${{ github.event.inputs.rom_name }}\`...\nSyncing manifest sources, log will follow. 📡"
        repo sync -c --no-tags --no-clone-bundle -j$(nproc) > /tmp/sync.log 2>&1
        tg_send_md "✅ *Repo Sync Completed* for \`${{ github.event.inputs.rom_name }}\`.\nAttaching repo sync log below. 📄"
        tg_stream_file /tmp/sync.log

    - name: Clone Device Trees
      run: |
        cd rom
        git clone ${{ github.event.inputs.device_tree }} device/xiaomi/blossom
        git clone ${{ github.event.inputs.vendor_tree }} vendor/xiaomi/blossom
        git clone ${{ github.event.inputs.kernel_tree }} kernel/xiaomi/blossom
        git clone ${{ github.event.inputs.kernel_tree }} device/xiaomi/blossom-kernel
        git clone ${{ github.event.inputs.hardware_tree }} hardware/mediatek
        git clone ${{ github.event.inputs.sepolicy_tree }} device/mediatek/sepolicy_vndr
    - name: Generate Changelog
      run: |
        cd rom
        echo "📜 Changelog (last 7 days):" > changelog.txt
        END_DATE=$(date -u +%Y-%m-%d)
        START_DATE=$(date -u -d "-7 days" +%Y-%m-%d)
        for dir in $(find . -maxdepth 2 -type d -name ".git" | sed 's/\/.git//'); do
          cd "$dir"
          echo -e "\n🔧 $(basename $(git rev-parse --show-toplevel)):" >> ../../changelog.txt
          git log --since=$START_DATE --until=$END_DATE --pretty=format:"• %s [%an]" >> ../../changelog.txt || echo "No commits"
          cd - > /dev/null
        done
        cd ..

    - name: Build ROM
      run: |
        source .github/scripts/telegram.sh
        cd rom
        export ALLOW_MISSING_DEPENDENCIES=true
        export CCACHE_EXEC=$(which ccache)
        export USE_CCACHE=1
        ccache -M 50G
        tg_send_md "🔥 *Build Started* for \`${{ github.event.inputs.rom_name }}\`...\nStreaming build log progress to the group. 📡"
        tg_progress_start /tmp/build.log
        trap 'tg_progress_stop /tmp/build.log' EXIT
        source build/envsetup.sh
        set +e
        brunch blossom > /tmp/build.log 2>&1
        RC=$?
        set -e
        exit $RC

    - name: Upload to GitHub Release - Success
      if: success()
      run: |
        END_TIME=$(date +%s)
        DURATION=$(( (END_TIME - START_TIME) / 60 ))
        cd rom/out/target/product/${{ github.event.inputs.device_codename }}
        FILE=$(ls *.zip | head -n 1)
        SIZE=$(du -h "$FILE" | cut -f1)
        MD5=$(md5sum "$FILE" | cut -d ' ' -f1)
        CHANGELOG=$(tail -n 60 ../../../../changelog.txt | sed 's/`/\\`/g' | head -c 3000)
        echo "BUILD_FILE=$FILE" >> $GITHUB_ENV
        echo "BUILD_SIZE=$SIZE" >> $GITHUB_ENV
        echo "BUILD_MD5=$MD5" >> $GITHUB_ENV
        echo "BUILD_DURATION=$DURATION" >> $GITHUB_ENV
        printf '📋 Changelog (Last 7 Days)\n\n%s\n🏷️ ROM: %s\n📱 Device: %s (%s)\n📦 File: %s\n🧩 Size: %s\n🔐 MD5: %s\n⏱️ Build Time: %s minutes\n' \
          "$CHANGELOG" \
          "${{ github.event.inputs.rom_name }}" \
          "${{ github.event.inputs.device_codename }}" \
          "${{ github.event.inputs.device_name }}" \
          "$FILE" "$SIZE" "$MD5" "$DURATION" > release_notes.txt
        echo "RELEASE_NOTES=$(pwd)/release_notes.txt" >> $GITHUB_ENV
        echo "RELEASE_ZIP=$(pwd)/$FILE" >> $GITHUB_ENV

    - name: Publish GitHub Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "${{ github.event.inputs.rom_name }}-${{ github.event.inputs.device_codename }}-${{ github.run_id }}"
        name: "${{ github.event.inputs.rom_name }} for ${{ github.event.inputs.device_name }} (${{ github.event.inputs.device_codename }})"
        body_path: ${{ env.RELEASE_NOTES }}
        files: ${{ env.RELEASE_ZIP }}
        draft: false
        prerelease: false

    - name: Notify Telegram - Build Success
      if: success()
      run: |
        source .github/scripts/telegram.sh
        tg_send_md "🎉 *${{ github.event.inputs.rom_name }} Build Successful!*\n━━━━━━━━━━━━━━━━━━━━\n\
🏷️ *ROM:* \`${{ github.event.inputs.rom_name }}\`\n\
📱 *Device:* \`${{ github.event.inputs.device_codename }}\` ( ${{ github.event.inputs.device_name }} )\n\
📦 *File:* \`${BUILD_FILE}\`\n\
🧩 *Size:* \`${BUILD_SIZE}\`\n\
🔐 *MD5:* \`${BUILD_MD5}\`\n\
⏱️ *Build Time:* \`${BUILD_DURATION} minutes\`\n\
✅ *Status:* Released on GitHub. Check the *Releases* tab."
        tg_document "/tmp/build.log" "📋 Build log - ${{ github.event.inputs.rom_name }}"

    - name: Notify Telegram - Build Failed
      if: failure()
      run: |
        END_TIME=$(date +%s)
        DURATION=$(( (END_TIME - START_TIME) / 60 ))
        source .github/scripts/telegram.sh
        tg_send_md "❌ *${{ github.event.inputs.rom_name }} Build Failed*\n━━━━━━━━━━━━━━━━━━━━\n\
📱 *Device:* \`${{ github.event.inputs.device_codename }}\` ( ${{ github.event.inputs.device_name }} )\n\
⚙️ *Variant:* \`${{ github.event.inputs.lunch_combo }}\`\n\
⏱️ *Duration:* \`$DURATION minutes\`\n━━━━━━━━━━━━━━━━━━━━\n\
💥 *Error:* Check GitHub Actions logs for details."
        tg_document "/tmp/build.log" "💥 Build log - ${{ github.event.inputs.rom_name }}"

    - name: Clean Up Runner Workspace
      if: always()
      run: |
        cd "$GITHUB_WORKSPACE"
        rm -rf rom
        rm -f /tmp/build.log /tmp/sync.log /tmp/build.log.pos
        echo "Runner workspace cleaned."
