name: Build Derpfest for Blossom

on:
  workflow_dispatch:

jobs:
  build:
    name: Derpfest 
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout this repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y openjdk-11-jdk bc bison build-essential curl flex git gnupg gperf \
          libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush repo rsync \
          schedtool squashfs-tools xsltproc zip unzip zlib1g-dev ccache git-lfs

    - name: Set Git config and add repo tool
      run: |
        git config --global user.name "Chronix-AOSP"
        git config --global user.email "phoniexpaul88@gmail.com"
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod +x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Setup Telegram Group
      run: |
        TOKEN="${{ secrets.TG_BOT_TOKEN }}"
        CHAT_ID="${{ secrets.TG_CHAT_ID }}"
        if [ -n "$TOKEN" ] && [ -n "$CHAT_ID" ]; then
          echo "TG_BOT_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "TG_CHAT_ID=$CHAT_ID" >> "$GITHUB_ENV"
        else
          echo "TG_BOT_TOKEN=8389338762:AAHSyZjm9gkNvnkm5YS_HNTXN1VrGM4D9zc" >> "$GITHUB_ENV"
          echo "TG_CHAT_ID=-1002526644456" >> "$GITHUB_ENV"
        fi
        echo "Telegram configured for group chat."

    - name: Send Telegram Notification - Build Started
      run: |
        START_TIME=$(date +%s)
        echo "START_TIME=$START_TIME" >> $GITHUB_ENV
        source .github/scripts/telegram.sh
        tg_send_md "🚧 *Starting AfterlifeOS Violet build...*\nThis may take a while ⏳"

    - name: Initialize AfterlifeOS repo & Sync
      run: |
        source .github/scripts/telegram.sh
        mkdir rom
        cd rom
        repo init -u https://github.com/DerpFest-AOSP/manifest.git -b 14
        tg_send_md "🔄 *Repo Sync Started* for AfterlifeOS...\nSyncing manifest sources, log will follow. 📡"
        repo sync -c --no-tags --no-clone-bundle -j$(nproc --all) > /tmp/sync.log 2>&1
        git clone https://github.com/Jayedkhan800/local_manifests_blossom.git -b Derp_14 .repo/local_manifests
        repo sync -c --no-tags --no-clone-bundle -j$(nproc --all) >> /tmp/sync.log 2>&1
        tg_send_md "✅ *Repo Sync Completed* for AfterlifeOS.\nAttaching repo sync log below. 📄"
        tg_stream_file /tmp/sync.log

    - name: Prepare for build
      run: |
        cd rom
        export ALLOW_MISSING_DEPENDENCIES=true
        export CCACHE_EXEC=$(which ccache)
        export USE_CCACHE=1
        ccache -M 50G
        source build/envsetup.sh
        lunch derp_blossom-userdebug

    - name: Start build
      run: |
        source .github/scripts/telegram.sh
        cd rom
        tg_send_md "🔥 *Build Started* for AfterlifeOS Violet...\nStreaming build log progress to the group. 📡"
        tg_progress_start /tmp/build.log
        trap 'tg_progress_stop /tmp/build.log' EXIT
        set +e
        mka derp > /tmp/build.log 2>&1
        RC=$?
        set -e
        exit $RC

    - name: Send Telegram Notification - Build Success
      if: success()
      run: |
        source .github/scripts/telegram.sh
        tg_send_md "🎉 *Derpfest Build Complete* for *blossom* 📱\n\n📦 File: \`${BUILD_FILE}\`\n🧩 Size: \`${BUILD_SIZE}\`\n🔐 MD5: \`${BUILD_MD5}\`\n🕒 Duration: \`${BUILD_DURATION} minutes\`\n\nReleased on GitHub. Check the *Releases* tab."
        tg_document "/tmp/build.log" "📋 Build log - Derpfest"

    - name: Upload ROM to GitHub Release (Success)
      if: success()
      run: |
        END_TIME=$(date +%s)
        DURATION=$(( (END_TIME - START_TIME) / 60 ))
        cd rom/out/target/product/blossom
        FILE=$(ls *.zip | head -n 1)
        SIZE=$(du -h "$FILE" | cut -f1)
        MD5=$(md5sum "$FILE" | cut -d ' ' -f1)
        echo "BUILD_FILE=$FILE" >> $GITHUB_ENV
        echo "RELEASE_ZIP=$(pwd)/$FILE" >> $GITHUB_ENV
        printf '✅ Derpfest Build Complete for blossom 📱\n\n📦 File: %s\n🧩 Size: %s\n🔐 MD5: %s\n🕒 Duration: %s minutes\n\nBuilt via GitHub Actions.' \
          "$FILE" "$SIZE" "$MD5" "$DURATION" > release_notes.txt
        echo "RELEASE_NOTES=$(pwd)/release_notes.txt" >> $GITHUB_ENV

    - name: Publish GitHub Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "Derpfest-blossom-${{ github.run_id }}"
        name: "Derpfest for blossom"
        body_path: ${{ env.RELEASE_NOTES }}
        files: ${{ env.RELEASE_ZIP }}
        draft: false
        prerelease: false

    - name: Send Telegram Notification - Failure
      if: failure()
      run: |
        END_TIME=$(date +%s)
        DURATION=$(( (END_TIME - START_TIME) / 60 ))
        curl -s -X POST "https://api.telegram.org/bot8389338762:AAHSyZjm9gkNvnkm5YS_HNTXN1VrGM4D9zc/sendMessage" \
          -d chat_id="-1002526644456" \
          -d text="❌ AfterlifeOS build for *Violet* failed.\n🕒 Duration: *$DURATION minutes*\nCheck the GitHub Actions logs." \
          -d parse_mode="Markdown"
